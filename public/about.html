<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>О приложении — СтихТок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arsenal:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Serif', serif;
      font-size: 1.1em;
      line-height: 1.6;
      color: #000;
      background: #fff;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 10px 20vh;
    }
    body::selection {
      color: #000;
      background-color: #ffe66a;
    }
    ::-moz-selection {
      color: #000;
      background-color: #ffe66a;
    }
    h1 {
      font-family: Arsenal, sans-serif;
      font-weight: bold;
      font-size: 1.5em;
      text-align: center;
      padding-top: 20px;
      padding-left: 10px;
      padding-right: 10px;
      margin-bottom: 0.25em;
    }
    .tagline {
      padding: 5px 10px 20px;
      margin-bottom: 0.5rem;
    }
    p {
      margin: 0 0 1rem 0;
      padding-left: 10px;
      padding-right: 10px;
    }
    a {
      color: #000;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }
    a:hover {
      color: #000;
      border-bottom: 1px solid #000;
    }
  </style>
</head>
<body>
  <h1>СтихТок</h1>
  <p class="tagline">Это некоммерческий проект, разрабатываемый в свободное время. Здесь нет рекламы и никаких сборов денег.</p>
  <noindex><p>Email для обратной связи: <a href="mailto:admin@4te.me">admin@4te.me</a></p></noindex>
</body>
</html>
